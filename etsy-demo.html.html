ory:"Etsy Masterclass",pagesEstimate:24,coverGradient:"from-amber-600 to-orange-900",chapters:[{title:"Chapter 1: The Micro-Niche Advantage on Etsy",content:`Opening a generic gift or planner shop on Etsy leads to getting swallowed by 100,000 competitors. The secret to fast sales velocity is micro-niche positioning.
